<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抠图工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1419;
  --bg-elev: #161b22;
  --bg-elev-2: #1c2128;
  --border: #2a3038;
  --border-soft: #21262d;
  --text: #e6e4d9;
  --text-dim: #8b9199;
  --text-faint: #6e7681;
  --accent: #d4a373;
  --accent-hover: #e0b48a;
  --accent-dim: #6b4f3a;
  --danger: #b15b4f;
  --danger-hover: #c66e60;
  --ok: #7fa87a;
  --ok-dim: #3a4a36;
  --warn: #c4a76a;
  --warn-dim: #4a4030;
  --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  --sans: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --mono: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body { padding: 0; }

/* ============ 顶栏 ============ */
.topbar {
  border-bottom: 1px solid var(--border);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(8px);
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 14px;
}
.brand-mark {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.02em;
  color: var(--text);
}
.brand-mark::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--accent);
  margin-right: 10px;
  vertical-align: middle;
  transform: rotate(45deg);
}
.brand-sub {
  font-size: 12px;
  color: var(--text-faint);
  font-weight: 400;
  letter-spacing: 0.04em;
}
.topbar-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 12px;
  color: var(--text-dim);
}
.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-faint);
  margin-right: 6px;
  transition: background 0.3s;
}
.status-dot.loaded { background: var(--ok); box-shadow: 0 0 6px rgba(127,168,122,0.5); }
.status-dot.loading { background: var(--warn); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ============ 主布局 ============ */
.layout {
  display: grid;
  grid-template-columns: 360px 1fr;
  min-height: calc(100vh - 53px);
}
@media (max-width: 960px) {
  .layout { grid-template-columns: 1fr; }
}

/* ============ 左栏 ============ */
.sidebar {
  border-right: 1px solid var(--border);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  background: var(--bg);
}

.section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border-soft);
}

/* 模型选择 */
.model-select-wrap {
  position: relative;
}
.model-select {
  width: 100%;
  appearance: none;
  -webkit-appearance: none;
  background: var(--bg-elev);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 9px 32px 9px 12px;
  font-family: var(--sans);
  font-size: 13px;
  border-radius: 3px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.model-select:hover { border-color: var(--accent-dim); }
.model-select:focus { outline: none; border-color: var(--accent); }
.model-select-wrap::after {
  content: "";
  position: absolute;
  right: 14px;
  top: 50%;
  width: 5px;
  height: 5px;
  border-right: 1px solid var(--text-dim);
  border-bottom: 1px solid var(--text-dim);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

/* 拖拽区 */
.dropzone {
  border: 1px dashed var(--border);
  border-radius: 3px;
  padding: 32px 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-elev);
  position: relative;
}
.dropzone:hover {
  border-color: var(--accent-dim);
  background: var(--bg-elev-2);
}
.dropzone.dragover {
  border-color: var(--accent);
  background: var(--bg-elev-2);
}
.dropzone svg {
  width: 28px;
  height: 28px;
  color: var(--text-faint);
  margin-bottom: 10px;
  transition: color 0.2s;
}
.dropzone:hover svg { color: var(--accent); }
.dropzone-text {
  font-size: 13px;
  color: var(--text-dim);
}
.dropzone-text strong {
  color: var(--text);
  font-weight: 500;
}
.dropzone-hint {
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 6px;
  letter-spacing: 0.02em;
}

/* 进度 */
.progress-row {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
}
.progress-track {
  flex: 1;
  height: 2px;
  background: var(--border-soft);
  position: relative;
  overflow: hidden;
}
.progress-fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0%;
  background: var(--accent);
  transition: width 0.25s ease-out;
}
.progress-num {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  min-width: 32px;
  text-align: right;
}
.progress-status {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 动作按钮组 */
.actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.actions-row {
  display: flex;
  gap: 8px;
}

.btn {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  padding: 9px 16px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
}
.btn:hover:not(:disabled) {
  border-color: var(--accent-dim);
  background: var(--bg-elev-2);
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent);
}

.btn-primary {
  background: var(--accent);
  color: #1a1410;
  border-color: var(--accent);
  font-weight: 600;
}
.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

.btn-danger {
  border-color: var(--danger);
  color: var(--danger);
}
.btn-danger:hover:not(:disabled) {
  background: var(--danger);
  color: var(--bg);
}

.btn-ghost {
  background: transparent;
  border-color: var(--border-soft);
  color: var(--text-dim);
}
.btn-ghost:hover:not(:disabled) {
  color: var(--text);
  border-color: var(--border);
}

.btn-full { width: 100%; }

/* 日志 */
.log-panel {
  background: var(--bg-elev);
  border: 1px solid var(--border-soft);
  border-radius: 3px;
  height: 160px;
  overflow-y: auto;
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.7;
}
.log-panel::-webkit-scrollbar { width: 6px; }
.log-panel::-webkit-scrollbar-track { background: transparent; }
.log-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.log-line { color: var(--text-dim); }
.log-line .log-time { color: var(--text-faint); margin-right: 8px; }
.log-line.success { color: var(--ok); }
.log-line.error { color: var(--danger); }
.log-line.info { color: var(--text-dim); }
.log-line.success .log-time, .log-line.error .log-time { color: inherit; opacity: 0.6; }

/* ============ 右栏：预览网格 ============ */
.workspace {
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  overflow: hidden;
}
.workspace-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
}
.workspace-title {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: 0.01em;
}
.workspace-count {
  font-size: 12px;
  color: var(--text-faint);
  font-family: var(--mono);
}

.file-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
  align-content: start;
  overflow-y: auto;
  padding-right: 4px;
  flex: 1;
}
.file-grid::-webkit-scrollbar { width: 8px; }
.file-grid::-webkit-scrollbar-track { background: transparent; }
.file-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.file-card {
  background: var(--bg-elev);
  border: 1px solid var(--border-soft);
  border-radius: 3px;
  overflow: hidden;
  transition: border-color 0.15s, transform 0.15s;
}
.file-card:hover {
  border-color: var(--border);
}
.file-card.processing {
  border-color: var(--warn-dim);
}
.file-card.done {
  border-color: var(--ok-dim);
}

.file-preview {
  position: relative;
  aspect-ratio: 1 / 1;
  background-color: var(--bg-elev-2);
  background-image:
    linear-gradient(45deg, var(--bg-elev) 25%, transparent 25%),
    linear-gradient(-45deg, var(--bg-elev) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--bg-elev) 75%),
    linear-gradient(-45deg, transparent 75%, var(--bg-elev) 75%);
  background-size: 12px 12px;
  background-position: 0 0, 0 6px, 6px -6px, -6px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.file-preview img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
}

.file-meta {
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border-top: 1px solid var(--border-soft);
}
.file-name {
  font-size: 12px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.file-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-faint);
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.file-badge::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.badge-pending { color: var(--text-faint); }
.badge-processing { color: var(--warn); }
.badge-processing::before { animation: pulse 1.4s ease-in-out infinite; }
.badge-done { color: var(--ok); }
.badge-error { color: var(--danger); }

.file-actions {
  display: flex;
  gap: 4px;
}
.icon-btn {
  width: 26px;
  height: 26px;
  border: 1px solid var(--border-soft);
  background: transparent;
  color: var(--text-dim);
  border-radius: 2px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.icon-btn:hover:not(:disabled) {
  color: var(--accent);
  border-color: var(--accent-dim);
}
.icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.icon-btn svg { width: 13px; height: 13px; }

/* 空状态 */
.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--text-faint);
  gap: 12px;
  padding: 60px 20px;
}
.empty-mark {
  font-family: var(--serif);
  font-size: 32px;
  color: var(--border);
  font-weight: 700;
  letter-spacing: 0.1em;
}
.empty-text {
  font-size: 13px;
  color: var(--text-faint);
  max-width: 280px;
  line-height: 1.6;
}

/* ============ 加载遮罩 ============ */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 20, 25, 0.85);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.loading-overlay.show { display: flex; }
.loading-box {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 32px 40px;
  text-align: center;
  min-width: 340px;
}
.loading-mark {
  font-family: var(--serif);
  font-size: 14px;
  color: var(--accent);
  letter-spacing: 0.2em;
  margin-bottom: 14px;
}
.loading-bar {
  width: 200px;
  height: 1px;
  background: var(--border);
  position: relative;
  margin: 0 auto 16px;
  overflow: hidden;
}
.loading-bar::after {
  content: "";
  position: absolute;
  left: -40%;
  top: 0;
  bottom: 0;
  width: 40%;
  background: var(--accent);
  animation: loading-slide 1.4s ease-in-out infinite;
}
@keyframes loading-slide {
  0% { left: -40%; }
  100% { left: 100%; }
}
#loadingText {
  font-size: 12.5px;
  color: var(--text-dim);
  font-family: var(--mono);
  letter-spacing: 0.02em;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-meta">
    <span><span class="status-dot" id="statusDot"></span><span id="modelStatus">未加载</span></span>
  </div>
</div>

<div class="layout">
  <!-- 左栏：控制 -->
  <aside class="sidebar">
    <div>
      <div class="section-label">模型</div>
      <div class="model-select-wrap">
        <select id="modelSelect" class="model-select">
          <option value="isnet-anime" selected>isnet-anime · 动漫/二次元插画，细节最佳</option>
          <option value="u2net">u2net · 通用场景，人像/物体/商品</option>
          <option value="u2netp">u2netp · 轻量快速，大批量处理</option>
        </select>
      </div>
    </div>

    <div>
      <div class="section-label">输入</div>
      <div class="dropzone" id="dropZone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <div class="dropzone-text"><strong>拖入图片</strong> 或点击选择</div>
        <div class="dropzone-hint">JPG · PNG · BMP · WEBP · 可多选</div>
        <input type="file" id="fileInput" multiple accept="image/*" style="display:none;">
      </div>
    </div>

    <div id="progressSection" style="display:none;">
      <div class="section-label">进度</div>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
        <div class="progress-num" id="progressNum">0%</div>
      </div>
      <div class="progress-status" id="statusText">就绪</div>
    </div>

    <div id="batchActions" style="display:none;">
      <div class="section-label">操作</div>
      <div class="actions">
        <button id="startBtn" class="btn btn-primary btn-full">开始抠图</button>
        <div class="actions-row">
          <button id="cancelBtn" class="btn btn-danger" disabled style="flex:1">取消</button>
          <button id="downloadAllBtn" class="btn btn-ghost" disabled style="flex:1">打包 ZIP</button>
        </div>
        <button id="clearBtn" class="btn btn-ghost btn-full">清空列表</button>
      </div>
    </div>

    <div>
      <div class="section-label">日志</div>

  <!-- 右栏：预览 -->
  <main class="workspace">
    <div class="workspace-header">
      <div class="workspace-title">预览</div>
      <div class="workspace-count" id="workspaceCount">0 项</div>
    </div>
    <div class="file-grid" id="fileList"></div>
    <div class="empty" id="emptyHint">
      <div class="empty-mark">·</div>
      <div class="empty-text">尚未添加图片<br>从左侧拖入文件开始</div>
    </div>
  </main>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="loading-mark">LOADING</div>
    <div class="loading-bar"></div>
    <div id="loadingText">正在加载模型...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
// ============== 配置 ==============
// 生成分卷路径列表（每个分卷 24MB，绕过 GitHub 25MB Web 上传限制）
function buildParts(base, count) {
  return Array.from({ length: count }, (_, i) => `${base}.part${i}`);
}

const MODELS = {
  'isnet-anime': {
    parts: buildParts('u2net/isnet-anime.onnx', 7),
    size: 1024,
    mean: [0.485, 0.456, 0.406],
    std: [1.0, 1.0, 1.0]
  },
  'u2net': {
    parts: buildParts('u2net/u2net.onnx', 7),
    size: 320,
    mean: [0.485, 0.456, 0.406],
    std: [1.0, 1.0, 1.0]
  },
  'u2netp': {
    parts: ['u2net/u2netp.onnx'],
    size: 320,
    mean: [0.485, 0.456, 0.406],
    std: [1.0, 1.0, 1.0]
  }
};

// ============== 状态 ==============
let session = null;
let currentModel = null;
let files = [];
let isProcessing = false;
let cancelFlag = false;

// ============== IndexedDB 缓存 ==============
const DB_NAME = 'rembg_models';
const DB_VERSION = 1;
const STORE_NAME = 'models';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => { req.result.createObjectStore(STORE_NAME); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function getCachedModel(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function setCachedModel(key, buffer) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const req = tx.objectStore(STORE_NAME).put(buffer, key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
// 流式下载单个 URL 并显示进度
async function fetchWithProgress(url, onProgress) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`HTTP ${response.status} - ${url}`);
  const total = parseInt(response.headers.get('content-length') || '0');
  const reader = response.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    if (total > 0 && onProgress) onProgress(received, total);
  }
  return new Blob(chunks).arrayBuffer();
}

// 下载多分卷并合并为单个 ArrayBuffer（用于绕过 GitHub 25MB 单文件限制）
async function fetchPartsWithProgress(parts, onProgress) {
  // 先 HEAD 获取每个分卷大小计算总大小
  let totalSize = 0;
  const sizes = [];
  for (const url of parts) {
    try {
      const r = await fetch(url, { method: 'HEAD' });
      const len = parseInt(r.headers.get('content-length') || '0');
      sizes.push(len);
      totalSize += len;
    } catch {
      sizes.push(0);
    }
  }

  // 顺序下载并合并
  const merged = new Uint8Array(totalSize);
  let received = 0;
  for (let i = 0; i < parts.length; i++) {
    const resp = await fetch(parts[i]);
    if (!resp.ok) throw new Error(`HTTP ${resp.status} - ${parts[i]}`);
    const reader = resp.body.getReader();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      merged.set(value, received);
      received += value.length;
      if (onProgress) onProgress(received, totalSize);
    }
  }
  return merged.buffer;
}

// ============== DOM ==============
const $ = id => document.getElementById(id);
const dropZone = $('dropZone');
const fileInput = $('fileInput');
const fileListEl = $('fileList');
const emptyHint = $('emptyHint');
const logBox = $('logBox');
const loadingOverlay = $('loadingOverlay');
const loadingText = $('loadingText');
const statusDot = $('statusDot');

// ============== 日志 ==============
function log(msg, type = 'info') {
  const line = document.createElement('div');
  line.className = 'log-line ' + type;
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  line.innerHTML = `<span class="log-time">${time}</span>${msg}`;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
}

// ============== 模型加载 ==============
function setStatus(state) {
  statusDot.className = 'status-dot' + (state ? ' ' + state : '');
}
async function loadModel() {
  const modelName = $('modelSelect').value;
  const config = MODELS[modelName];

  if (session && currentModel === modelName) {
    log('模型已加载，无需重复加载', 'info');
    return;
  }

  try {
    loadingOverlay.classList.add('show');
    setStatus('loading');
    $('modelStatus').textContent = '加载中';
    log(`开始加载模型: ${modelName}`, 'info');

    ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/';

    loadingText.textContent = `正在检查缓存...`;
    const cached = await getCachedModel(modelName);
    let buffer;

    if (cached) {
      loadingText.textContent = `从缓存加载 ${modelName}...`;
      log('命中缓存，直接加载（首次后秒加载）', 'success');
      buffer = cached;
    } else {
      loadingText.textContent = `正在下载 ${modelName} 模型...`;
      log(`首次加载，正在下载 ${modelName}（仅此次需要，之后会缓存）`, 'info');
      buffer = await fetchPartsWithProgress(config.parts, (received, total) => {
        const pct = Math.round(received / total * 100);
        const mb = (received / 1024 / 1024).toFixed(1);
        const totalMb = (total / 1024 / 1024).toFixed(1);
        loadingText.textContent = `下载中 ${mb}/${totalMb} MB · ${pct}%`;
      });
      await setCachedModel(modelName, buffer);
      log('已缓存到 IndexedDB，下次加载将秒开', 'success');
    }

    loadingText.textContent = `正在初始化模型...`;
    session = await ort.InferenceSession.create(buffer, {
      executionProviders: ['wasm'],
      graphOptimizationLevel: 'all'
    });

    currentModel = modelName;
    setStatus('loaded');
    $('modelStatus').textContent = `${modelName}`;
    log(`模型加载成功: ${modelName}`, 'success');
    updateStartBtn();
  } catch (e) {
    log(`模型加载失败: ${e.message}`, 'error');
    log('请确保通过本地 HTTP 服务器访问本页面（不能直接双击打开 HTML）', 'error');
    setStatus('');
    $('modelStatus').textContent = '未加载';
    alert('模型加载失败！\n\n请确保：\n1. 使用"启动网页版.bat"启动\n2. 不要直接双击 HTML 文件打开\n\n错误: ' + e.message);
  } finally {
    loadingOverlay.classList.remove('show');
  }
}

// ============== 图片处理 ==============
function preprocessImage(img, config) {
  const size = config.size;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, size, size);

  const imageData = ctx.getImageData(0, 0, size, size);
  const data = imageData.data;

  let maxVal = 0;
  for (let i = 0; i < data.length; i += 4) {
    maxVal = Math.max(maxVal, data[i], data[i+1], data[i+2]);
  }
  if (maxVal === 0) maxVal = 1;

  const input = new Float32Array(3 * size * size);
  for (let i = 0; i < data.length; i += 4) {
    const idx = i / 4;
    input[idx] = (data[i] / maxVal - config.mean[0]) / config.std[0];
    input[size * size + idx] = (data[i+1] / maxVal - config.mean[1]) / config.std[1];
    input[2 * size * size + idx] = (data[i+2] / maxVal - config.mean[2]) / config.std[2];
  }
  return input;
}

function postprocessMask(outputData) {
  const size = Math.sqrt(outputData.length);
  let ma = -Infinity, mi = Infinity;
  for (let i = 0; i < outputData.length; i++) {
    ma = Math.max(ma, outputData[i]);
    mi = Math.min(mi, outputData[i]);
  }
  const range = ma - mi || 1;

  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = size;
  maskCanvas.height = size;
  const maskCtx = maskCanvas.getContext('2d');
  const maskImageData = maskCtx.createImageData(size, size);

  for (let i = 0; i < outputData.length; i++) {
    const val = Math.round(((outputData[i] - mi) / range) * 255);
    maskImageData.data[i * 4] = val;
    maskImageData.data[i * 4 + 1] = val;
    maskImageData.data[i * 4 + 2] = val;
    maskImageData.data[i * 4 + 3] = 255;
  }
  maskCtx.putImageData(maskImageData, 0, 0);
  return maskCanvas;
}

function compositeImage(origImg, maskCanvas) {
  const canvas = document.createElement('canvas');
  canvas.width = origImg.naturalWidth;
  canvas.height = origImg.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(origImg, 0, 0);

  const scaledMask = document.createElement('canvas');
  scaledMask.width = canvas.width;
  scaledMask.height = canvas.height;
  const scaledCtx = scaledMask.getContext('2d');
  scaledCtx.imageSmoothingEnabled = true;
  scaledCtx.imageSmoothingQuality = 'high';
  scaledCtx.drawImage(maskCanvas, 0, 0, canvas.width, canvas.height);

  const maskData = scaledCtx.getImageData(0, 0, canvas.width, canvas.height);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < imageData.data.length; i += 4) {
    imageData.data[i + 3] = maskData.data[i];
  }
  ctx.putImageData(imageData, 0, 0);
  return canvas;
}

async function processOne(fileObj) {
  const config = MODELS[currentModel];
  const img = new Image();
  img.src = fileObj.previewUrl;
  await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; });

  const input = preprocessImage(img, config);
  const inputTensor = new ort.Tensor('float32', input, [1, 3, config.size, config.size]);
  const feeds = {};
  feeds[session.inputNames[0]] = inputTensor;
  const results = await session.run(feeds);
  const output = results[session.outputNames[0]];
  const maskCanvas = postprocessMask(output.data);
  const resultCanvas = compositeImage(img, maskCanvas);

  return new Promise((resolve) => {
    resultCanvas.toBlob((blob) => resolve(blob), 'image/png');
  });
}

// ============== 批量处理 ==============
async function startProcessing() {
  if (!session) { alert('请先加载模型'); return; }
  if (files.length === 0) { alert('请先添加图片'); return; }

  isProcessing = true;
  cancelFlag = false;
  $('progressSection').style.display = 'block';
  $('startBtn').disabled = true;
  $('cancelBtn').disabled = false;
  $('downloadAllBtn').disabled = true;

  const total = files.length;
  let ok = 0, fail = 0;

  for (let i = 0; i < total; i++) {
    if (cancelFlag) { log('已取消', 'info'); break; }
    const f = files[i];
    if (f.status === 'done') { ok++; continue; }

    f.status = 'processing';
    updateFileCard(i);
    updateProgress(i, total, f.name);
    log(`(${i+1}/${total}) 处理中: ${f.name}`);

    try {
      const blob = await processOne(f);
      f.resultBlob = blob;
      f.resultUrl = URL.createObjectURL(blob);
      f.status = 'done';
      ok++;
      log(`✓ ${f.name}`, 'success');
    } catch (e) {
      f.status = 'error';
      f.error = e.message;
      fail++;
      log(`✗ ${f.name}: ${e.message}`, 'error');
    }
    updateFileCard(i);
  }

  updateProgress(total, total, '完成');
  log(`处理完成：共 ${total}，成功 ${ok}，失败 ${fail}`, 'success');

  isProcessing = false;
  $('startBtn').disabled = false;
  $('cancelBtn').disabled = true;
  const hasResult = files.some(f => f.resultBlob);
  $('downloadAllBtn').disabled = !hasResult;
}

function cancelProcessing() { cancelFlag = true; }

// ============== UI 更新 ==============
function updateProgress(current, total, name) {
  const pct = Math.round((current / total) * 100);
  $('progressBar').style.width = pct + '%';
  $('progressNum').textContent = pct + '%';
  $('statusText').textContent = `(${current}/${total}) ${name}`;
}

function updateFileCard(index) {
  const f = files[index];
  const card = document.querySelector(`[data-index="${index}"]`);
  if (!card) return;

  const badge = card.querySelector('.file-badge');
  const statusText = {
    pending: '待处理', processing: '处理中', done: '已完成', error: '失败'
  }[f.status];
  badge.textContent = statusText;
  badge.className = 'file-badge badge-' + f.status;

  card.className = 'file-card ' + f.status;

  const previewImg = card.querySelector('.file-preview img');
  if (f.resultUrl && f.status === 'done') {
    previewImg.src = f.resultUrl;
  } else if (f.previewUrl) {
    previewImg.src = f.previewUrl;
  }

  const dlBtn = card.querySelector('.download-btn');
  if (dlBtn) dlBtn.disabled = !f.resultBlob;
}

function renderFileList() {
  fileListEl.innerHTML = '';
  $('workspaceCount').textContent = `${files.length} 项`;
  if (files.length === 0) {
    emptyHint.style.display = 'flex';
    $('batchActions').style.display = 'none';
    $('progressSection').style.display = 'none';
    return;
  }
  emptyHint.style.display = 'none';
  $('batchActions').style.display = 'block';

  files.forEach((f, i) => {
    const card = document.createElement('div');
    card.className = 'file-card ' + f.status;
    card.dataset.index = i;
    card.innerHTML = `
      <div class="file-preview">
        <img src="${f.previewUrl}" alt="${f.name}">
      </div>
      <div class="file-meta">
        <span class="file-name" title="${f.name}">${f.name}</span>
        <span class="file-badge badge-pending">待处理</span>
      </div>
      <div class="file-actions" style="padding: 0 12px 10px; justify-content: flex-end;">
        <button class="icon-btn download-btn" disabled title="下载" onclick="downloadOne(${i})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
      </div>
    `;
    fileListEl.appendChild(card);
  });
}

function updateStartBtn() {
  $('startBtn').disabled = !session || files.length === 0;
}

// ============== 文件操作 ==============
function addFiles(fileList) {
  for (const file of fileList) {
    if (!file.type.startsWith('image/')) continue;
    files.push({
      file: file, name: file.name, status: 'pending',
      previewUrl: URL.createObjectURL(file),
      resultBlob: null, resultUrl: null
    });
  }
  renderFileList();
  updateStartBtn();
  log(`已添加 ${fileList.length} 个文件，共 ${files.length} 个`);
}

function clearFiles() {
  files.forEach(f => {
    if (f.previewUrl) URL.revokeObjectURL(f.previewUrl);
    if (f.resultUrl) URL.revokeObjectURL(f.resultUrl);
  });
  files = [];
  renderFileList();
  updateStartBtn();
  log('已清空列表');
}

function downloadOne(index) {
  const f = files[index];
  if (!f.resultBlob) return;
  const a = document.createElement('a');
  a.href = f.resultUrl;
  a.download = f.name.replace(/\.[^.]+$/, '') + '.png';
  a.click();
}

async function downloadAll() {
  const done = files.filter(f => f.resultBlob);
  if (done.length === 0) return;
  log(`开始打包 ${done.length} 个文件...`);
  const zip = new JSZip();
  for (const f of done) {
    zip.file(f.name.replace(/\.[^.]+$/, '') + '.png', f.resultBlob);
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cutout_${new Date().toISOString().slice(0, 10)}.zip`;
  a.click();
  URL.revokeObjectURL(url);
  log('打包下载完成', 'success');
}

// ============== 事件绑定 ==============
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => { addFiles(e.target.files); fileInput.value = ''; });
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});

$('loadModelBtn') && $('loadModelBtn').addEventListener('click', loadModel);
$('startBtn').addEventListener('click', startProcessing);
$('cancelBtn').addEventListener('click', cancelProcessing);
$('clearBtn').addEventListener('click', clearFiles);
$('downloadAllBtn').addEventListener('click', downloadAll);

// 切换模型时自动重新加载
$('modelSelect').addEventListener('change', () => {
  // 重置当前 session，强制重新加载
  session = null;
  currentModel = null;
  setStatus('');
  $('modelStatus').textContent = '未加载';
  updateStartBtn();
  loadModel();
});

// 启动
log('工具已就绪，正在自动加载模型...', 'info');
log('提示：首次加载 isnet-anime 约 176MB，需等待下载；之后会缓存到浏览器，下次秒开', 'info');
window.addEventListener('load', () => { loadModel(); });
</script>
